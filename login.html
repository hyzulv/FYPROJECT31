   <!DOCTYPE html>
<html>
<head>
    <title>Mat Rock Login</title>

    <style>

    body{
        font-family: Arial;
        background: #111;
    }

    .login-box{
        width: 350px;
        margin: 100px auto;
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 15px red;
    }

    h2{
        text-align: center;
        color: red;
        margin-bottom: 20px;
    }

    input{
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: 1px solid #444;
        background: #2b2b2b;
        color: white;
        border-radius: 5px;
    }

    input::placeholder{
        color: #bbb;
    }

    button{
        width: 100%;
        padding: 12px;
        margin-top: 18px;
        background: red;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover{
        background: darkred;
    }

</style>
</head>

<body>

<div class="login-box">
    <h2>Staff / Admin Login</h2>

    <form action="login.php" method="POST">

        <input type="text" name="username" placeholder="Enter Username" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>
</div>

</body>
</html>
